<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sip - كشك المشروبات المميزة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f4f7f2;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            text-align: center;
            padding: 30px 20px;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الشعار */
        .logo-section img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #eaeaea;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* النصوص الترحيبية */
        .welcome-text h1 {
            font-size: 1.3rem;
            color: #2e5a36;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .welcome-text p {
            font-size: 1.1rem;
            color: #555;
            font-weight: 500;
            margin-bottom: 25px;
        }

        /* شبكة عرض المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .product-card {
            background: #fafcf8;
            border: 1px solid #e2ebd9;
            border-radius: 16px;
            padding: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(46, 90, 54, 0.1);
        }

        .product-card img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .product-card span {
            font-size: 0.9rem;
            font-weight: 700;
            color: #333;
            display: block;
        }

        /* قسم وسائل التواصل الاجتماعي */
        .social-section {
            margin-bottom: 20px;
        }

        .social-section h3 {
            font-size: 1.1rem;
            color: #444;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            color: #fff;
            font-size: 1.5rem;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .social-btn.instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }

        .social-btn.tiktok {
            background: #000000;
        }

        .social-btn:hover {
            transform: scale(1.1);
        }

        /* التذييل */
        footer {
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-section">
            <img src="logo.png.jpg" alt="Sip Logo" id="main-logo">
        </div>

        <div class="welcome-text">
            <h1>مع كل رشفة احساس غير تقليدي 🤍</h1>
            <p id="location-text">كشك sip بمزرعة نخلا بريدة 🤍</p>
        </div>

        <div class="products-grid">
            <div class="product-card">
                <img src="matcha_grape.png.jpg" alt="آيس ماتشا بالعنب والفراولة">
                <span>آيس ماتشا بالعنب والفراولة</span>
            </div>
            <div class="product-card">
                <img src="matcha_lotus.png.jpg" alt="آيس ماتشا باللوتس والكراميل">
                <span>آيس ماتشا باللوتس والكراميل</span>
            </div>
            <div class="product-card">
                <img src="slash_mango.png.jpg" alt="سلاش مانجو وباشن فروت">
                <span>سلاش مانجو وباشن فروت</span>
            </div>
            <div class="product-card">
                <img src="milkshake_cookie.png.jpg" alt="ميلك شيك كوكيز والكراميل">
                <span>ميلك شيك كوكيز والكراميل</span>
            </div>
        </div>

        <div class="social-section">
            <h3 id="follow-title">تابعونا</h3>
            <div class="social-links">
                <a href="https://www.instagram.com/sip_ts?igsh=MTFvb2I4N252dHdmMg==" target="_blank" class="social-btn instagram" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/@sip_ts?_r=1&_t=ZS-98MEo3R3gmH" target="_blank" class="social-btn tiktok" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
        </div>

        <footer>
            <p id="footer-text">© 2026 كشك Sip - جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // تحديث السنة تلقائياً في التذييل والتأكد من أنها 2026
            const footerText = document.getElementById("footer-text");
            const currentYear = new Date().getFullYear(); // سيجلب 2026 تلقائياً
            footerText.innerHTML = `© ${currentYear} كشك Sip - جميع الحقوق محفوظة 🤍`;

            // تأثير تفاعلي عند الضغط على أزرار التواصل الاجتماعي
            const socialButtons = document.querySelectorAll('.social-btn');
            socialButtons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    // تأثير اهتزاز بسيط أو تنبيه بصري قبل الانتقال
                    console.log("تم الانتقال إلى رابط التواصل بنجاح");
                });
            });

            // تأثير ترحيبي بسيط يظهر في وحدة التحكم (Console)
            console.log("مرحباً بك في موقع كشك Sip - بريدة (2026)");
        });
    </script>
</body>
</html>
